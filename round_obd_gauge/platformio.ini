[platformio]
src_dir = src

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
