[platformio]
src_dir = src

# Original S3: native USB (303A:1001), 4MB embedded flash. Serial over USB-CDC.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

# New S3: CH340 USB-UART bridge (/dev/cu.usbserial-*), 16MB flash, 8MB PSRAM.
# Serial goes over UART0 (the CH340), so do NOT enable USB-CDC-on-boot here.
[env:esp32s3_uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default.csv
